spring.application.name=demo

# Luôn UTF-8 cho HTTP (JSON API, static) — tránh lỗi font tiếng Việt trên Windows.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

app.upstash.rest-url=
app.upstash.token=${UPSTASH_REDIS_REST_TOKEN:}
app.upstash.key-style=prefixed

app.redis.seed-on-startup=true
app.redis.demo-session-id=demo-session-001
